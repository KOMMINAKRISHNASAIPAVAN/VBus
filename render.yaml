# Render Blueprint — deploys VBus (frontend + backend + database) in one click.
# In Render: New → Blueprint → pick this repo → Apply.

databases:
  - name: vbus-db
    databaseName: vbus
    user: vbus
    plan: free

services:
  # ---- Backend (FastAPI) ----
  - type: web
    name: vbus-backend
    runtime: python
    plan: free
    rootDir: vbus/backend
    buildCommand: pip install -r requirements.txt
    startCommand: python seed.py && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: DATABASE_URL
        fromDatabase:
          name: vbus-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: "*"

  # ---- Frontend (React + Vite, static) ----
  - type: web
    name: vbus-frontend
    runtime: static
    rootDir: vbus/frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: vbus-backend
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
