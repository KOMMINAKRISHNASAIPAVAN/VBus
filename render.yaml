# Render Blueprint — FastAPI serves the React build + the API under ONE URL.
# New → Blueprint → pick this repo → Apply.

databases:
  - name: vbus-db
    databaseName: vbus
    user: vbus
    plan: free

services:
  - type: web
    name: vbus
    runtime: python
    plan: free
    rootDir: vbus/backend
    buildCommand: >
      pip install -r requirements.txt &&
      (npm --prefix ../frontend install && npm --prefix ../frontend run build || echo "Frontend build skipped") &&
      python seed.py || true
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: DATABASE_URL
        fromDatabase:
          name: vbus-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: "*"
